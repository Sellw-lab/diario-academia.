<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Meu Treino</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
    background: #090909;
    color: #ffffff;
    min-height: 100vh;
    padding-bottom: 40px;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 20px 16px 40px;
}

/* TOPO */

.topo {
    padding-top: 12px;
    margin-bottom: 25px;
}

.pequeno {
    color: #8e8e93;
    font-size: 14px;
    margin-bottom: 5px;
}

.titulo {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -1px;
}

.subtitulo {
    color: #8e8e93;
    margin-top: 5px;
}

/* CARDS */

.card {
    background: #151515;
    border: 1px solid #242424;
    border-radius: 22px;
    padding: 18px;
    margin-bottom: 16px;
}

/* RESUMO */

.resumo {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 18px;
}

.resumo-item {
    background: #1d1d1d;
    border-radius: 15px;
    padding: 13px 5px;
    text-align: center;
}

.resumo-numero {
    font-size: 20px;
    font-weight: 800;
}

.resumo-label {
    font-size: 11px;
    color: #8e8e93;
    margin-top: 4px;
}

/* TÍTULOS */

.titulo-secao {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.titulo-secao h2 {
    font-size: 20px;
}

.icone {
    font-size: 22px;
}

/* INPUTS */

label {
    display: block;
    color: #a8a8ad;
    font-size: 13px;
    margin-bottom: 7px;
    margin-top: 14px;
}

input,
select {
    width: 100%;
    background: #202020;
    color: #ffffff;
    border: 1px solid #303030;
    border-radius: 13px;
    padding: 14px;
    font-size: 16px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #666;
}

/* BOTÕES */

button {
    border: none;
    font-size: 15px;
    font-weight: 700;
    border-radius: 13px;
    padding: 13px 15px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.btn-principal {
    width: 100%;
    background: #ffffff;
    color: #000000;
    margin-top: 15px;
}

.btn-principal:active {
    transform: scale(.98);
}

.btn-salvar {
    width: 100%;
    background: #ffffff;
    color: #000000;
    font-size: 17px;
    padding: 17px;
    margin: 5px 0 25px;
    border-radius: 17px;
}

.btn-salvar:active {
    transform: scale(.98);
}

/* EXERCÍCIO */

.exercicio {
    background: #1b1b1b;
    border: 1px solid #292929;
    border-radius: 18px;
    padding: 15px;
    margin-top: 14px;
}

.exercicio-topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 13px;
}

.exercicio-nome {
    font-size: 17px;
    font-weight: 800;
}

.btn-excluir {
    background: #292929;
    color: #ff5c5c;
    padding: 7px 9px;
    font-size: 12px;
}

.cabecalho-series {
    display: grid;
    grid-template-columns: 35px 1fr 1fr 32px;
    gap: 7px;
    color: #777;
    font-size: 11px;
    margin-bottom: 7px;
}

.serie {
    display: grid;
    grid-template-columns: 35px 1fr 1fr 32px;
    gap: 7px;
    align-items: center;
    margin-bottom: 8px;
}

.numero-serie {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: #292929;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 800;
}

.serie input {
    padding: 9px;
    font-size: 14px;
}

.btn-remover-serie {
    width: 32px;
    height: 32px;
    padding: 0;
    background: #292929;
    color: #888;
}

.btn-adicionar-serie {
    width: 100%;
    background: #242424;
    color: #ffffff;
    margin-top: 5px;
    font-size: 13px;
}

/* CARDIO */

.cardio-box {
    background: #1b1b1b;
    border-radius: 17px;
    padding: 14px;
    margin-top: 12px;
}

/* HISTÓRICO */

.historico-card {
    background: #151515;
    border: 1px solid #242424;
    border-radius: 18px;
    margin-bottom: 12px;
    overflow: hidden;
}

.historico-cabecalho {
    padding: 16px;
    cursor: pointer;
}

.historico-data {
    color: #8e8e93;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
}

.historico-nome {
    font-size: 18px;
    font-weight: 800;
    margin-top: 5px;
}

.historico-resumo {
    color: #8e8e93;
    font-size: 13px;
    margin-top: 7px;
}

.historico-conteudo {
    display: none;
    padding: 0 16px 16px;
    border-top: 1px solid #252525;
}

.historico-conteudo.aberto {
    display: block;
}

.historico-exercicio {
    padding-top: 15px;
}

.historico-exercicio strong {
    font-size: 15px;
}

.historico-serie {
    color: #a8a8ad;
    margin-top: 7px;
    font-size: 14px;
}

.historico-serie strong {
    color: white;
}

.historico-cardio {
    background: #1d1d1d;
    border-radius: 12px;
    padding: 12px;
    margin-top: 15px;
    font-size: 13px;
    color: #b5b5b5;
}

.btn-excluir-treino {
    width: 100%;
    margin-top: 18px;
    background: #251515;
    color: #ff5c5c;
}

/* VAZIO */

.vazio {
    text-align: center;
    color: #777;
    padding: 25px 10px;
    font-size: 14px;
}

/* SELETOR */

select {
    appearance: none;
}

/* RESPONSIVO */

@media (max-width: 380px) {

    .titulo {
        font-size: 30px;
    }

    .container {
        padding-left: 12px;
        padding-right: 12px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- TOPO -->

    <div class="topo">

        <div class="pequeno">
            DIÁRIO DE ACADEMIA
        </div>

        <div class="titulo">
            Meu Treino 🏋️
        </div>

        <div class="subtitulo">
            Registre sua evolução.
        </div>

    </div>


    <!-- NOVO TREINO -->

    <div class="card">

        <div class="titulo-secao">

            <h2>🔥 Novo treino</h2>

        </div>


        <label>Data</label>

        <input
            type="date"
            id="dataTreino"
        >


        <label>Nome do treino</label>

        <input
            type="text"
            id="nomeTreino"
            placeholder="Ex: Peito + Tríceps"
        >


        <label>Adicionar exercício</label>

        <select id="exercicioSelect">

            <option value="">
                Escolha um exercício
            </option>

            <optgroup label="Peito">

                <option>Supino reto</option>
                <option>Supino inclinado</option>
                <option>Crucifixo máquina</option>
                <option>Crossover</option>
                <option>Peck deck</option>

            </optgroup>

            <optgroup label="Costas">

                <option>Puxada frontal</option>
                <option>Remada baixa</option>
                <option>Remada cavalinho</option>
                <option>Remada curvada</option>
                <option>Pulldown</option>

            </optgroup>

            <optgroup label="Ombros">

                <option>Desenvolvimento</option>
                <option>Elevação lateral</option>
                <option>Elevação frontal</option>
                <option>Crucifixo inverso</option>

            </optgroup>

            <optgroup label="Bíceps">

                <option>Rosca direta</option>
                <option>Rosca alternada</option>
                <option>Rosca martelo</option>
                <option>Rosca Scott</option>

            </optgroup>

            <optgroup label="Tríceps">

                <option>Tríceps pulley</option>
                <option>Tríceps corda</option>
                <option>Tríceps francês</option>
                <option>Tríceps testa</option>

            </optgroup>

            <optgroup label="Pernas">

                <option>Agachamento</option>
                <option>Leg press</option>
                <option>Cadeira extensora</option>
                <option>Mesa flexora</option>
                <option>Cadeira flexora</option>
                <option>Panturrilha</option>

            </optgroup>

        </select>


        <button
            class="btn-principal"
            onclick="adicionarExercicio()"
        >
            ＋ Adicionar exercício
        </button>


        <div id="exerciciosContainer"></div>

    </div>


    <!-- CARDIO -->

    <div class="card">

        <div class="titulo-secao">

            <h2>🏃 Cardio</h2>

        </div>


        <div class="cardio-box">

            <label>Tipo</label>

            <select id="tipoCardio">

                <option value="">
                    Não fiz cardio
                </option>

                <option>Esteira</option>
                <option>Bicicleta</option>
                <option>Elíptico</option>
                <option>Caminhada</option>
                <option>Corrida</option>

            </select>


            <label>Tempo (min)</label>

            <input
                type="number"
                id="tempoCardio"
                placeholder="20"
                min="0"
            >


            <label>Velocidade (km/h)</label>

            <input
                type="number"
                id="velocidadeCardio"
                placeholder="5.0"
                step="0.1"
                min="0"
            >


            <label>Distância (km)</label>

            <input
                type="number"
                id="distanciaCardio"
                placeholder="1.6"
                step="0.1"
                min="0"
            >

        </div>

    </div>


    <!-- RESUMO DO TREINO -->

    <div
        class="card"
        id="resumoAtual"
    >

        <div class="titulo-secao">

            <h2>📊 Resumo</h2>

        </div>

        <div class="resumo">

            <div class="resumo-item">

                <div
                    class="resumo-numero"
                    id="totalExercicios"
                >
                    0
                </div>

                <div class="resumo-label">
                    Exercícios
                </div>

            </div>


            <div class="resumo-item">

                <div
                    class="resumo-numero"
                    id="totalSeries"
                >
                    0
                </div>

                <div class="resumo-label">
                    Séries
                </div>

            </div>


            <div class="resumo-item">

                <div
                    class="resumo-numero"
                    id="totalCardio"
                >
                    0
                </div>

                <div class="resumo-label">
                    Cardio
                </div>

            </div>

        </div>

    </div>


    <!-- SALVAR -->

    <button
        class="btn-salvar"
        onclick="salvarTreino()"
    >
        💾 Finalizar treino
    </button>


    <!-- HISTÓRICO -->

    <div class="card">

        <div class="titulo-secao">

            <h2>📊 Histórico</h2>

        </div>

        <div id="historico"></div>

    </div>

</div>


<script>

let exerciciosAtuais = [];


/* DATA ATUAL */

const hoje = new Date();

document.getElementById("dataTreino").value =
    hoje.toISOString().split("T")[0];


/* ADICIONAR EXERCÍCIO */

function adicionarExercicio() {

    const select =
        document.getElementById("exercicioSelect");

    const nome = select.value;


    if (!nome) {

        alert("Escolha um exercício.");

        return;

    }


    const existe =
        exerciciosAtuais.find(
            e => e.nome === nome
        );


    if (existe) {

        alert("Esse exercício já está no treino.");

        return;

    }


    exerciciosAtuais.push({

        id: Date.now(),

        nome: nome,

        series: [

            {
                peso: "",
                repeticoes: ""
            }

        ]

    });


    select.value = "";

    renderizar();

}


/* RENDERIZAR */

function renderizar() {

    const container =
        document.getElementById(
            "exerciciosContainer"
        );


    container.innerHTML = "";


    exerciciosAtuais.forEach(
        (exercicio, index) => {

            const div =
                document.createElement("div");

            div.className = "exercicio";


            let html = `

                <div class="exercicio-topo">

                    <div class="exercicio-nome">

                        🏋️ ${exercicio.nome}

                    </div>

                    <button
                        class="btn-excluir"
                        onclick="removerExercicio(${index})"
                    >
                        Excluir
                    </button>

                </div>

                <div class="cabecalho-series">

                    <div>SÉRIE</div>

                    <div>PESO</div>

                    <div>REPS</div>

                    <div></div>

                </div>

            `;


            exercicio.series.forEach(
                (serie, serieIndex) => {

                    html += `

                        <div class="serie">

                            <div class="numero-serie">
                                ${serieIndex + 1}
                            </div>

                            <input
                                type="number"
                                placeholder="kg"
                                value="${serie.peso}"
                                min="0"
                                step="0.1"
                                onchange="
                                alterarPeso(
                                    ${index},
                                    ${serieIndex},
                                    this.value
                                )"
                            >

                            <input
                                type="number"
                                placeholder="reps"
                                value="${serie.repeticoes}"
                                min="0"
                                onchange="
                                alterarReps(
                                    ${index},
                                    ${serieIndex},
                                    this.value
                                )"
                            >

                            <button
                                class="btn-remover-serie"
                                onclick="
                                removerSerie(
                                    ${index},
                                    ${serieIndex}
                                )"
                            >
                                ×
                            </button>

                        </div>

                    `;

                }
            );


            html += `

                <button
                    class="btn-adicionar-serie"
                    onclick="adicionarSerie(${index})"
                >
                    ＋ Adicionar série
                </button>

            `;


            div.innerHTML = html;

            container.appendChild(div);

        }
    );


    atualizarResumo();

}


/* ADICIONAR SÉRIE */

function adicionarSerie(index) {

    exerciciosAtuais[index].series.push({

        peso: "",

        repeticoes: ""

    });


    renderizar();

}


/* REMOVER SÉRIE */

function removerSerie(
    exercicioIndex,
    serieIndex
) {

    if (
        exerciciosAtuais[
            exercicioIndex
        ].series.length <= 1
    ) {

        alert(
            "O exercício precisa ter pelo menos uma série."
        );

        return;

    }


    exerciciosAtuais[
        exercicioIndex
    ].series.splice(
        serieIndex,
        1
    );


    renderizar();

}


/* REMOVER EXERCÍCIO */

function removerExercicio(index) {

    exerciciosAtuais.splice(
        index,
        1
    );

    renderizar();

}


/* ALTERAR PESO */

function alterarPeso(
    exercicioIndex,
    serieIndex,
    valor
) {

    exerciciosAtuais[
        exercicioIndex
    ].series[
        serieIndex
    ].peso = valor;

}


/* ALTERAR REPETIÇÕES */

function alterarReps(
    exercicioIndex,
    serieIndex,
    valor
) {

    exerciciosAtuais[
        exercicioIndex
    ].series[
        serieIndex
    ].repeticoes = valor;

}


/* RESUMO */

function atualizarResumo() {

    let totalSeries = 0;

    exerciciosAtuais.forEach(
        exercicio => {

            totalSeries +=
                exercicio.series.length;

        }
    );


    document.getElementById(
        "totalExercicios"
    ).textContent =
        exerciciosAtuais.length;


    document.getElementById(
        "totalSeries"
    ).textContent =
        totalSeries;


    const cardio =
        document.getElementById(
            "tempoCardio"
        ).value;


    document.getElementById(
        "totalCardio"
    ).textContent =
        cardio ? cardio + "m" : "0";

}


/* ATUALIZAR CARDIO */

document.getElementById(
    "tempoCardio"
).addEventListener(
    "input",
    atualizarResumo
);


/* SALVAR */

function salvarTreino() {

    const data =
        document.getElementById(
            "dataTreino"
        ).value;


    const nome =
        document.getElementById(
            "nomeTreino"
        ).value.trim();


    if (!nome) {

        alert(
            "Digite o nome do treino."
        );

        return;

    }


    if (
        exerciciosAtuais.length === 0
    ) {

        alert(
            "Adicione pelo menos um exercício."
        );

        return;

    }


    const treino = {

        id: Date.now(),

        data: data,

        nome: nome,

        exercicios:
            exerciciosAtuais,

        cardio: {

            tipo:
                document.getElementById(
                    "tipoCardio"
                ).value,

            tempo:
                document.getElementById(
                    "tempoCardio"
                ).value,

            velocidade:
                document.getElementById(
                    "velocidadeCardio"
                ).value,

            distancia:
                document.getElementById(
                    "distanciaCardio"
                ).value

        }

    };


    const historico =
        JSON.parse(
            localStorage.getItem(
                "treinos"
            )
        ) || [];


    historico.unshift(treino);


    localStorage.setItem(
        "treinos",
        JSON.stringify(historico)
    );


    alert(
        "Treino salvo! 💪"
    );


    limparTreino();

    carregarHistorico();

}


/* LIMPAR */

function limparTreino() {

    exerciciosAtuais = [];


    document.getElementById(
        "nomeTreino"
    ).value = "";


    document.getElementById(
        "tipoCardio"
    ).value = "";


    document.getElementById(
        "tempoCardio"
    ).value = "";


    document.getElementById(
        "velocidadeCardio"
    ).value = "";


    document.getElementById(
        "distanciaCardio"
    ).value = "";


    renderizar();

}


/* HISTÓRICO */

function carregarHistorico() {

    const container =
        document.getElementById(
            "historico"
        );


    const historico =
        JSON.parse(
            localStorage.getItem(
                "treinos"
            )
        ) || [];


    container.innerHTML = "";


    if (
        historico.length === 0
    ) {

        container.innerHTML = `

            <div class="vazio">

                🏋️

                <br><br>

                Seus treinos aparecerão aqui.

            </div>

        `;

        return;

    }


    historico.forEach(
        (treino, index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "historico-card";


            const totalSeries =
                treino.exercicios.reduce(
                    (
                        total,
                        exercicio
                    ) =>
                        total +
                        exercicio.series.length,
                    0
                );


            const cardio =
                treino.cardio &&
                treino.cardio.tempo
                    ? treino.cardio.tempo + " min"
                    : "Sem cardio";


            card.innerHTML = `

                <div
                    class="historico-cabecalho"
                    onclick="
                    abrirHistorico(${index})
                    "
                >

                    <div class="historico-data">

                        ${formatarData(
                            treino.data
                        )}

                    </div>


                    <div class="historico-nome">

                        ${treino.nome}

                    </div>


                    <div class="historico-resumo">

                        ${treino.exercicios.length}
                        exercícios
                        •
                        ${totalSeries}
                        séries
                        •
                        ${cardio}

                    </div>

                </div>


                <div
                    class="historico-conteudo"
                    id="historico-${index}"
                >

                    ${renderizarHistorico(
                        treino
                    )}

                    <button
                        class="btn-excluir-treino"
                        onclick="
                        excluirTreino(${index})
                        "
                    >

                        🗑️ Excluir treino

                    </button>

                </div>

            `;


            container.appendChild(card);

        }
    );

}


/* HISTÓRICO DETALHADO */

function renderizarHistorico(treino) {

    let html = "";


    treino.exercicios.forEach(
        exercicio => {

            html += `

                <div class="historico-exercicio">

                    <strong>
                        🏋️ ${exercicio.nome}
                    </strong>

            `;


            exercicio.series.forEach(
                (serie, index) => {

                    html += `

                        <div class="historico-serie">

                            Série ${index + 1}:

                            <strong>
                                ${serie.peso || 0} kg
                            </strong>

                            ×

                            <strong>
                                ${serie.repeticoes || 0} reps
                            </strong>

                        </div>

                    `;

                }
            );


            html += `</div>`;

        }
    );


    if (
        treino.cardio &&
        treino.cardio.tipo
    ) {

        html += `

            <div class="historico-cardio">

                🏃 <strong>
                    ${treino.cardio.tipo}
                </strong>

                <br><br>

                ⏱️
                ${treino.cardio.tempo || 0}
                minutos

                ${
                    treino.cardio.velocidade
                    ?
                    ` • ${treino.cardio.velocidade} km/h`
                    :
                    ""
                }

                ${
                    treino.cardio.distancia
                    ?
                    ` • ${treino.cardio.distancia} km`
                    :
                    ""
                }

            </div>

        `;

    }


    return html;

}


/* ABRIR HISTÓRICO */

function abrirHistorico(index) {

    const elemento =
        document.getElementById(
            "historico-" + index
        );


    elemento.classList.toggle(
        "aberto"
    );

}


/* EXCLUIR */

function excluirTreino(index) {

    const confirmar =
        confirm(
            "Excluir este treino?"
        );


    if (!confirmar) return;


    const historico =
        JSON.parse(
            localStorage.getItem(
                "treinos"
            )
        ) || [];


    historico.splice(
        index,
        1
    );


    localStorage.setItem(
        "treinos",
        JSON.stringify(
            historico
        )
    );


    carregarHistorico();

}


/* DATA */

function formatarData(data) {

    const partes =
        data.split("-");


    const meses = [

        "JAN",
        "FEV",
        "MAR",
        "ABR",
        "MAI",
        "JUN",
        "JUL",
        "AGO",
        "SET",
        "OUT",
        "NOV",
        "DEZ"

    ];


    return `
        ${partes[2]}
        ${meses[
            Number(partes[1]) - 1
        ]}
        ${partes[0]}
    `;

}

renderizar();

carregarHistorico();
