<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Treino</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #1c1c1c;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 20px;
            max-width: 500px;
            margin: auto;
        }

        .card {
            background: #1c1c1c;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #00c853;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        label {
            font-weight: bold;
        }

        .treino {
            border-left: 4px solid #00c853;
            padding-left: 12px;
            margin-bottom: 15px;
        }

        .vazio {
            color: #aaa;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>🏋️ Meu Treino</h1>
    <p>Diário de cargas</p>
</header>

<div class="container">

    <div class="card">
        <h2>Novo treino</h2>

        <label>Exercício</label>
        <input id="exercicio" type="text" placeholder="Ex: Supino reto">

        <label>Carga (kg)</label>
        <input id="carga" type="number" placeholder="Ex: 40">

        <label>Repetições</label>
        <input id="repeticoes" type="number" placeholder="Ex: 10">

        <label>Séries</label>
        <input id="series" type="number" placeholder="Ex: 4">

        <button onclick="salvarTreino()">💾 Salvar treino</button>
    </div>

    <div class="card">
        <h2>📊 Histórico</h2>

        <div id="historico">
            <p class="vazio">Nenhum treino registrado.</p>
        </div>
    </div>

</div>

<script>

function salvarTreino() {

    const exercicio = document.getElementById("exercicio").value;
    const carga = document.getElementById("carga").value;
    const repeticoes = document.getElementById("repeticoes").value;
    const series = document.getElementById("series").value;

    if (!exercicio || !carga || !repeticoes || !series) {
        alert("Preencha todos os campos!");
        return;
    }

    const treino = {
        exercicio: exercicio,
        carga: carga,
        repeticoes: repeticoes,
        series: series,
        data: new Date().toLocaleDateString("pt-BR")
    };

    let treinos = JSON.parse(localStorage.getItem("treinos")) || [];

    treinos.push(treino);

    localStorage.setItem("treinos", JSON.stringify(treinos));

    document.getElementById("exercicio").value = "";
    document.getElementById("carga").value = "";
    document.getElementById("repeticoes").value = "";
    document.getElementById("series").value = "";

    mostrarHistorico();
}

function mostrarHistorico() {

    const historico = document.getElementById("historico");

    let treinos = JSON.parse(localStorage.getItem("treinos")) || [];

    if (treinos.length === 0) {
        historico.innerHTML =
            '<p class="vazio">Nenhum treino registrado.</p>';
        return;
    }

    historico.innerHTML = "";

    treinos.reverse().forEach(treino => {

        historico.innerHTML += `
            <div class="treino">
                <strong>${treino.exercicio}</strong>
                <p>📅 ${treino.data}</p>
                <p>🏋️ ${treino.carga} kg</p>
                <p>🔁 ${treino.repeticoes} repetições</p>
                <p>📚 ${treino.series} séries</p>
            </div>
        `;

    });
}

mostrarHistorico();

</script>

</body>
</html>
